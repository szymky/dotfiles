"$schema" = 'https://starship.rs/config-schema.json'

format = """
$os\
$directory\
$git_branch\
$git_status\
$git_state\
$fill\
$rust\
$c\
$cmake\
$nodejs\
$bun\
$python\
$java\
$zig\
$cmd_duration\
$line_break\
$character"""

# ── Palette ───────────────────────────────────────────────────────────────────

palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
mauve     = "#cba6f7"
red       = "#f38ba8"
maroon    = "#eba0ac"
peach     = "#fab387"
yellow    = "#f9e2af"
green     = "#a6e3a1"
teal      = "#94e2d5"
sky       = "#89dceb"
sapphire  = "#74c7ec"
blue      = "#89b4fa"
lavender  = "#b4befe"
text      = "#cdd6f4"
subtext1  = "#bac2de"
subtext0  = "#a6adc8"
overlay2  = "#9399b2"
overlay1  = "#7f849c"
overlay0  = "#6c7086"
surface2  = "#585b70"
surface1  = "#45475a"
surface0  = "#313244"
base      = "#1e1e2e"
mantle    = "#181825"
crust     = "#11111b"

# ── Prompt character ──────────────────────────────────────────────────────────

[character]
success_symbol = "[❯](mauve)"
error_symbol   = "[❯](red)"
vimcmd_symbol  = "[❮](green)"

# ── OS icon ───────────────────────────────────────────────────────────────────

[os]
disabled = false
format   = "[$symbol](overlay1) "

[os.symbols]
Arch = ""

# ── Directory ─────────────────────────────────────────────────────────────────

[directory]
format            = "[$path](blue bold)[$read_only](red) "
truncation_length = 4
truncate_to_repo  = true
read_only         = " 󰌾"
home_symbol       = "~"

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music"     = "󰝚"
"Pictures"  = ""
"Videos"    = "󰕧"
".config"   = ""
"src"       = ""
"dev"       = ""

# ── Git ───────────────────────────────────────────────────────────────────────

[git_branch]
format = "on [$symbol$branch](mauve bold) "
symbol = " "

[git_status]
format    = "([$all_status$ahead_behind](surface2))"
ahead     = "⇡${count}"
behind    = "⇣${count}"
diverged  = "⇕⇡${ahead_count}⇣${behind_count}"
staged    = "[+${count}](green)"
modified  = "[~${count}](yellow)"
untracked = "[?${count}](overlay1)"
deleted   = "[-${count}](red)"
stashed   = "[*${count}](teal)"
ignore_submodules = true
disabled = false

[custom.git_home_ignore]

[git_state]
format = '\([$state( $progress_current/$progress_total)](yellow)\) '

# ── Fill ──────────────────────────────────────────────────────────────────────

[fill]
symbol = " "

# ── Languages ─────────────────────────────────────────────────────────────────

[nodejs]
format  = "[ $version](green) "
detect_files = ["package.json", ".node-version", ".nvmrc"]

[bun]
format  = "[🥟 $version](yellow) "

[rust]
format       = "[ $version](peach bold) "
detect_files = ["Cargo.toml", "Cargo.lock", ".rust-version"]

[c]
format            = "[ $version](sapphire) "
detect_extensions = ["c", "h", "cpp", "hpp", "s", "S", "asm"]
detect_files      = ["Makefile", "CMakeLists.txt", "meson.build"]
commands          = [["gcc", "--version"], ["clang", "--version"], ["cc", "--version"]]

[cmake]
format   = "[△ $version](overlay1) "

[python]
format  = "[ $version](yellow) "
detect_files = ["pyproject.toml", "requirements.txt", ".python-version", "Pipfile"]

[java]
format  = "[ $version](red) "

[zig]
format  = "[ $version](peach) "
symbol  = "⚡"

# ── Command duration ──────────────────────────────────────────────────────────

[cmd_duration]
format            = "[󱎫 $duration](overlay1) "
min_time          = 2000
show_milliseconds = false

# ── Disabled modules ──────────────────────────────────────────────────────────

[package]
disabled = true

[time]
disabled = true
