

# ── Font ─────────────────────────────────────────────────────────────────────

font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic

font_size        13.0
modify_font      cell_height 110%
modify_font      baseline -1

disable_ligatures never

# ── Window ────────────────────────────────────────────────────────────────────

remember_window_size  no
initial_window_width  1000
initial_window_height 640
placement_strategy    center

window_padding_width     12 16
single_window_padding_width 12 16

hide_window_decorations  yes
draw_minimal_borders     yes
window_border_width      1pt

active_border_color   #cba6f7
inactive_border_color #313244

# ── Background ────────────────────────────────────────────────────────────────

background_opacity 0.88
background_blur    32

dynamic_background_color no

# ── Cursor ────────────────────────────────────────────────────────────────────

cursor                #f5e0dc
cursor_text_color     #1e1e2e
cursor_shape          beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.6
cursor_stop_blinking_after 8

# ── Scrollback ────────────────────────────────────────────────────────────────

scrollback_lines 10000
wheel_scroll_multiplier 3.0

# ── Mouse ─────────────────────────────────────────────────────────────────────

url_color          #89b4fa
url_style          straight
open_url_with      default
detect_urls        yes
copy_on_select     no
mouse_hide_wait    2.0

# ── Bell ─────────────────────────────────────────────────────────────────────

enable_audio_bell  no
window_alert_on_bell no
visual_bell_duration 0.0

# ── Tab bar ───────────────────────────────────────────────────────────────────

tab_bar_edge             bottom
tab_bar_style            powerline
tab_powerline_style      slanted
tab_bar_min_tabs         2
tab_bar_margin_width     0
tab_bar_margin_height    4 4

tab_title_template       "{fmt.fg._cba6f7}{index}:{fmt.fg.tab} {title}"
active_tab_title_template "{fmt.fg._1e1e2e}{fmt.bg._cba6f7} {index}:{title} "

active_tab_foreground    #1e1e2e
active_tab_background    #cba6f7
active_tab_font_style    bold

inactive_tab_foreground  #6c7086
inactive_tab_background  #181825
inactive_tab_font_style  normal

tab_bar_background       #11111b

# ── Colors — Catppuccin Mocha ─────────────────────────────────────────────────

foreground  #cdd6f4
background  #1e1e2e
selection_foreground #1e1e2e
selection_background #f5e0dc

# Black
color0  #45475a
color8  #585b70

# Red
color1  #f38ba8
color9  #f38ba8

# Green
color2  #a6e3a1
color10 #a6e3a1

# Yellow
color3  #f9e2af
color11 #f9e2af

# Blue
color4  #89b4fa
color12 #89b4fa

# Magenta
color5  #f5c2e7
color13 #f5c2e7

# Cyan
color6  #94e2d5
color14 #94e2d5

# White
color7  #bac2de
color15 #a6adc8

# Extra
mark1_foreground #1e1e2e
mark1_background #b4befe
mark2_foreground #1e1e2e
mark2_background #cba6f7
mark3_foreground #1e1e2e
mark3_background #74c7ec

# ── Performance ───────────────────────────────────────────────────────────────

sync_to_monitor       no
repaint_delay         8
input_delay           2

# ── Shell ─────────────────────────────────────────────────────────────────────

shell_integration     enabled
allow_hyperlinks      yes
term                  xterm-256color
